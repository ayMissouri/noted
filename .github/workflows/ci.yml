name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: sqlc output is current
        run: go tool sqlc diff

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t noted-ci .
      - name: image starts and serves healthz
        run: |
          docker run -d --name noted-ci -p 6683:6683 noted-ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:6683/healthz; then exit 0; fi
            sleep 1
          done
          echo "server never became healthy"
          docker logs noted-ci
          exit 1
      - name: compose stack serves through the proxy
        run: |
          docker rm -f noted-ci
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/healthz; then docker compose down -v; exit 0; fi
            sleep 1
          done
          docker compose logs
          docker compose down -v
          exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: committed client assets match sources
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "web/dist is stale: run npm run build in web/ and commit the output"
            exit 1
          fi
